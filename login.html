<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inloggen | Scheepsplanbord</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f3f5f8;
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.box {
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 4px 20px #0001;
  width: 320px;
  max-width: 85%;
}
h2 { color: #292f4c; }
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 6px;
  border: 1px solid #ccc;
}
button {
  background: #515878;
  color: white;
  cursor: pointer;
  border: 0;
  font-weight: bold;
}
#melding { font-size: 14px; }
</style>
</head>
<body>
<div class="box">
  <h2>Scheepsplanbord</h2>
  <p>Log in met je account</p>
  <form id="loginForm">
    <input type="email" id="email"
      placeholder="E-mailadres" required>
    <input type="password" id="password"
      placeholder="Wachtwoord" required>
    <button type="submit">Inloggen</button>
  </form>
  <p id="melding"></p>
</div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://yonliumwqzasdqzxhvvf.supabase.co";
 const SUPABASE_KEY = "sb_publishable_ykwK6HnplxzAJUED7D7hfg_x8UePP9R";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const melding = document.getElementById("melding");
    melding.textContent = "Bezig met inloggen...";

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      melding.textContent = "Inloggen mislukt: " + error.message;
      return;
    }

    window.location.href = "index.html";
  });
</script>
</body>
  
</html>
